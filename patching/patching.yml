---
- name: Patching the existing packages to the latest version
  hosts: all
  become: true
  vars_files:
    - creds
  pre_tasks:
    - name: Check the register with Redhat Subscription
      ansible.builtin.command: subscription-manager status
      register: sub_status
      changed_when: true
      ignore_errors: true

    - name: Subscription check
      ansible.builtin.debug:
        msg: "Server already registered with Redhat subscription"
      when: sub_status.rc == 0

    - name: Register the server with Redhat subscription if not registered
      redhat.rhel_system_roles.redhat_subscription:
        username: "{{ redhat_username }}"
        password: "{{ redhat_password }}"
      register: reg_status
      when: sub_status.rc != 0

    - name: Subscription check
      ansible.builtin.debug:
        var: reg_status.msg
      when: sub_status.rc != 0

  tasks:
    - name: Fetch the available updates
      ansible.builtin.yum:
        list: updates
        update_cache: true
      register: check_out

    - name: Check list
      ansible.builtin.debug:
        msg: "{{ check_out.results | map(attribute='name') | list }}"

    - name: Apply patches
      ansible.builtin.yum:
        name: '*'
        state: latest
      register: patch_out

    - name: Patching output
      ansible.builtin.debug:
        var: patch_out.results

    - name: Reboot the machine
      ansible.builtin.reboot:
        polls: 5
        retries: 10
        #reboot_timeout: 90
        #test_command: uptime
      tags: reboot_out